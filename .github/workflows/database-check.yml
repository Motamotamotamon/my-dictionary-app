name: Database availability check

on:
  schedule:
    # 09:23 and 21:23 JST (UTC)
    - cron: '23 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/database-check.yml'

permissions: {}

concurrency:
  group: database-availability-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production database connection
        shell: python
        run: |
          import json
          import urllib.request
          base = "https://my-dictionary-app-nu.vercel.app"
          paths = ["/api/health/database"]
          for path in paths:
              req = urllib.request.Request(base + path, headers={
                  "Cache-Control": "no-cache",
                  "User-Agent": "dictionary-app-availability-check"
              })
              try:
                  with urllib.request.urlopen(req, timeout=40) as response:
                      payload = json.load(response)
                      if response.status != 200 or payload != {"ok": True}:
                          raise ValueError("Unexpected API response")
                      if "no-store" not in response.headers.get("Cache-Control", ""):
                          raise ValueError("Expected uncached database read")
              except Exception:
                  raise SystemExit("Database availability check failed: " + path.split("?")[0])
              print("Database-backed API healthy: " + path.split("?")[0])
